[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-motion"
version = "0.1.0"
description = "Modular, reusable computer vision biomechanics and CPU-trained ML pipeline for motion analysis and exercise form assessment."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Athena Team"}
]
keywords = ["computer-vision", "mediapipe", "biomechanics", "machine-learning", "fitness", "motion-analysis", "onnx"]
dependencies = [
    "opencv-python>=4.10.0",
    "mediapipe>=1.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "joblib>=1.3.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
fastapi = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0"
]

[project.scripts]
athena-motion = "athena_motion.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["athena_motion*"]
