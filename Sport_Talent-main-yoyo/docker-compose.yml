version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://athena_user:athena_secret@db:5432/athena_db
      - ATHENA_SECRET_KEY=athena-secure-production-key-2026
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=athena_user
      - POSTGRES_PASSWORD=athena_secret
      - POSTGRES_DB=athena_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
